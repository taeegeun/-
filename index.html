<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>우리 도시 건설단</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  /* 설계 도면(청사진) 위에 도시 모형을 올려놓은 화면. 강조는 공사장 안전 노랑 하나. */
  --paper:#0f2d4f; --paper-2:#143a63; --line:#2a5688; --ink:#e6f0ff; --ink-dim:#9db8dc;
  --accent:#ffc93c; --good:#62d394; --bad:#ff6b6b; --card:#f7f4ea; --card-ink:#1b2a3d;
  --display:"Do Hyeon","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --body:"IBM Plex Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;word-break:keep-all;overflow-wrap:anywhere}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:8px 16px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.1}
.brand b{font-family:var(--display);font-weight:400;font-size:24px;letter-spacing:.5px;color:var(--accent)}
.brand span{font-size:12px;color:var(--ink-dim)}
.stats{display:flex;flex-wrap:wrap;gap:6px;flex:1}
.chip{display:flex;flex-direction:column;min-width:0;padding:2px 8px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.18)}
.chip small{font-size:11px;color:var(--ink-dim)}
.chip b{font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;white-space:nowrap}
.chip.bad{border-color:var(--bad)} .chip.bad b{color:var(--bad)}
.chip.good b{color:var(--good)}
.ctrl{display:flex;flex-wrap:wrap;gap:6px}
.ctrl .btn{padding:5px 9px}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:4px;background:transparent}
.btn:hover{background:rgba(255,255,255,.08)}
.btn.on{background:var(--accent);color:#1b2a3d;border-color:var(--accent);font-weight:700}
.btn.pri{background:var(--accent);color:#1b2a3d;border-color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.mission{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 16px 7px 28px;position:relative;background:#0b2440;border-bottom:1px solid var(--line)}
.mission::before{content:"";position:absolute;left:0;top:0;bottom:0;width:16px;background:repeating-linear-gradient(135deg,var(--accent) 0 8px,#1b2a3d 8px 16px)}
.mission .tag{font-family:var(--display);color:var(--accent);font-size:16px}
.mission .rw{color:var(--good);font-variant-numeric:tabular-nums}
.alerts{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.alert{padding:1px 8px;border-radius:10px;background:rgba(255,107,107,.16);border:1px solid var(--bad);color:#ffd0d0;font-size:12px}
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 330px}
.stage{position:relative;min-height:0;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:40px 40px;background-position:-1px -1px}
canvas#map{display:block;touch-action:none;position:absolute;left:0;top:0}
.tip{position:absolute;pointer-events:none;padding:4px 8px;border-radius:4px;background:rgba(8,20,36,.92);border:1px solid var(--line);font-size:12px;white-space:nowrap;display:none;z-index:3}
.tip.no{border-color:var(--bad);color:#ffd0d0}
.toasts{position:absolute;left:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:4;max-width:70%}
.toast{padding:8px 12px;border-radius:4px;background:var(--card);color:var(--card-ink);border-left:6px solid var(--accent);box-shadow:0 4px 14px rgba(0,0,0,.35);animation:pop .25s ease-out}
.toast.bad{border-left-color:var(--bad)}
@keyframes pop{from{transform:translateY(8px);opacity:.3}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.zoom{position:absolute;right:12px;bottom:12px;display:flex;gap:6px;z-index:4}
.zoom .btn{background:var(--paper-2);min-width:36px}
.hint{pointer-events:none;position:absolute;right:12px;top:10px;font-size:12px;color:var(--ink-dim);text-align:right}
aside{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line);background:var(--paper-2)}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding:10px 10px 6px}
.tab{padding:4px 9px;border:1px solid var(--line);border-radius:4px;background:transparent;font-size:13px}
.tab.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.list{flex:1;min-height:120px;overflow-y:auto;padding:4px 10px 10px;display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:4px 8px;border:1px solid var(--line);border-radius:4px;background:rgba(0,0,0,.16);text-align:left;width:100%}
.item:hover{background:rgba(255,255,255,.07)}
.item.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item img{width:44px;height:44px}
.item .nm{font-weight:700;font-size:15px}
.item .fx{font-size:12px;color:var(--ink-dim)}
.item .cost{font-variant-numeric:tabular-nums;font-weight:700;color:var(--accent)}
.item.poor .cost{color:var(--bad)}
.item.locked img{filter:grayscale(1) brightness(.7)}
.item .lock{font-size:12px;padding:2px 6px;border-radius:3px;background:var(--accent);color:#1b2a3d;font-weight:700;white-space:nowrap}
.item .lock.lv{background:transparent;border:1px solid var(--line);color:var(--ink-dim);font-weight:400}
.tools{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--line)}
.tools .btn{flex:1;padding:6px 4px;font-size:13px;white-space:nowrap}
.info{padding:10px;border-top:1px solid var(--line);min-height:96px;max-height:34%;overflow-y:auto;font-size:13px}
.info h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:17px}
.info ul{margin:4px 0 0;padding-left:18px}
.info .dim{color:var(--ink-dim)}
.ok{color:var(--good)} .ng{color:var(--bad)}
.veil{position:fixed;inset:0;background:rgba(5,14,26,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
.veil.show{display:flex}
.modal{width:min(720px,100%);max-height:100%;overflow-y:auto;background:var(--card);color:var(--card-ink);border-radius:6px;border-top:10px solid var(--accent);padding:20px 24px;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.modal h2{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:28px;text-wrap:balance}
.modal .eyebrow{font-size:12px;font-weight:700;color:#8a6a00;letter-spacing:.5px}
.modal p{margin:8px 0;max-width:60ch}
.modal .kw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.modal .kw span{padding:2px 8px;border-radius:3px;background:#1b2a3d;color:#fff;font-size:12px}
.modal .game{padding:8px 10px;border-left:4px solid #2f6fb3;background:#e7edf5;font-size:13px}
.modal .row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:16px}
.modal .btn{border-color:#9aa6b5;color:var(--card-ink)}
.modal .btn:hover{background:#ebe6d6}
.modal .btn.pri{border-color:var(--accent)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.opt{padding:10px 12px;border:2px solid #c8cfd9;border-radius:4px;background:#fff;color:var(--card-ink);text-align:left}
.opt:hover:not(:disabled){border-color:#2f6fb3}
.opt.right{border-color:#1f9d5b;background:#e3f6ea;font-weight:700}
.opt.wrong{border-color:#d43c3c;background:#fde8e8}
.ex{margin-top:12px;padding:8px 10px;background:#fff7d6;border-left:4px solid var(--accent);font-size:13px}
.field{display:flex;flex-direction:column;gap:2px;margin-top:10px;font-weight:700;font-size:13px}
.field input{font:inherit;padding:8px 10px;border:2px solid #c8cfd9;border-radius:4px;color:var(--card-ink);background:#fff}
.how{margin:10px 0 0;padding-left:20px}
.dex{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:12px}
.dex button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;border:1px solid #c8cfd9;border-radius:4px;background:#fff;color:var(--card-ink)}
.dex button:disabled{opacity:.5;cursor:default}
.dex img{width:52px;height:52px}
.maps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.mapcard{display:flex;flex-direction:column;gap:4px;padding:10px;border:2px solid #c8cfd9;border-radius:4px;background:#fff}
.mapcard.locked{background:#e9e6dc;color:#6b7480}
.mapcard .lv{font-size:12px;font-weight:700;color:#8a6a00}
.mapcard b{font-size:18px}
.mapcard small{color:#5a6676}
.mapcard .btn{margin-top:4px}
.fields2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.alerts .btn{padding:1px 10px;font-size:12px}
.req{padding:1px 10px;border-radius:10px;border:1px solid var(--accent);color:var(--accent);font-size:13px}
.req:empty{display:none}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:6px 0 10px}
.achs div{padding:6px 8px;border:1px dashed #c8cfd9;border-radius:4px;background:#f1eee4;color:#8a94a3}
.achs div.on{border-style:solid;border-color:#1f9d5b;background:#e3f6ea;color:var(--card-ink)}
.achs small{display:block;font-size:11px}
.slot{display:flex;flex-direction:column;gap:4px;padding:6px 0 0;margin-top:4px;border-top:1px solid #e3dfd2}
.slot .sl{font-weight:700;font-size:13px}
.slot .sb{display:flex;flex-wrap:wrap;gap:4px}
.mapcard .slot .btn{padding:4px 9px;font-size:12px;margin-top:0}
.rep{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin:12px 0}
.rep div{padding:6px 10px;background:#fff;border:1px solid #d9d4c2;border-radius:4px}
.rep small{display:block;font-size:11px;color:#5a6676}
.rep b{font-size:18px;font-variant-numeric:tabular-nums}
.grade{font-family:var(--display);font-size:56px;line-height:1;color:#2f6fb3}
textarea.copy{background:#fff;color:#1b2a3d;border:1px solid #c8cfd9;border-radius:4px;width:100%;height:120px;font:12px/1.5 var(--body);margin-top:8px}
@media (max-width:900px){
  html,body{height:auto}
  main{grid-template-columns:1fr}
  .stage{height:62vw;min-height:260px}
  aside{border-left:0;border-top:1px solid var(--line)}
  .list{max-height:320px}
  .maps,.fields2{grid-template-columns:1fr}
}
</style>
</head>
<body>
<header>
  <div class="brand"><b>우리 도시 건설단</b><span id="cityName">기술·가정 건설 기술 시뮬레이션</span></div>
  <div class="stats" id="stats"></div>
  <div class="ctrl">
    <button class="btn" id="spd0" type="button">일시정지</button>
    <button class="btn on" id="spd1" type="button">1배속</button>
    <button class="btn" id="spd2" type="button">2배속</button>
    <button class="btn" id="btnQuiz" type="button">기술 퀴즈</button>
    <button class="btn" id="btnDex" type="button">기술 도감</button>
    <button class="btn" id="btnRep" type="button">도시 보고서</button>
    <button class="btn pri" id="btnPhoto" type="button">도시 사진 찍기</button>
  </div>
</header>
<div class="mission">
  <span class="tag" id="mTag">미션 1</span><span id="mText"></span><span class="rw" id="mRw"></span><span class="req" id="req"></span>
  <div class="alerts" id="alerts"></div>
</div>
<main>
  <div class="stage" id="stage">
    <canvas id="map"></canvas>
    <div class="hint" id="hint">건물을 고르고 지도를 누르세요 · 도로는 끌어서 연속 건설 · 오른쪽 클릭: 철거 (끌면 연속 철거) · Esc 선택 해제<br>지도 이동: 살펴보기 상태에서 끌기 또는 방향키 · 확대: 마우스 휠</div>
    <div class="zoom"><button class="btn" id="zIn" type="button" aria-label="확대">＋</button><button class="btn" id="zOut" type="button" aria-label="축소">－</button><button class="btn" id="zFit" type="button">전체 보기</button></div>
    <div class="tip" id="tip"></div>
    <div class="toasts" id="toasts"></div>
  </div>
  <aside>
    <div class="tabs" id="tabs"></div>
    <div class="list" id="list"></div>
    <div class="tools">
      <button class="btn" id="btnInspect" type="button">살펴보기</button>
      <button class="btn" id="btnUpg" type="button">업그레이드</button>
      <button class="btn" id="btnDoze" type="button">철거</button>
      <button class="btn" id="btnNew" type="button">도시 선택</button>
    </div>
    <div class="info" id="info"></div>
  </aside>
</main>
<input type="file" id="fileIn" accept=".json,application/json" hidden>
<div class="veil" id="veil"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>

<script>

/* 도시 단계: 레벨이 오를 때마다 zones 크기(한 변의 칸 수)만큼 건설 가능 지역이 넓어진다 */
const MAPS=[
 {id:'plain',n:'평지 도시',sub:'1단계',N:80,zones:[14,24,34,46,62,80],desc:'넓은 평야에 강이 흐릅니다. 폭우가 오면 강이 넘칠 수 있습니다.',dis:{rain:6,surge:0,quake:2,fire:2},qmax:1},

];

            {n:'하드',money:2500,pmul:1.25,sea:2,pol:1.7,int:[26,42],warn:4,start:1,rep:.6,qmul:1.4,fr:1,wind:[.4,1.1],cloud:.3}];

 ['city0','평지 도시 완성','평지 도시를 최고 레벨까지 키웠다'],['city1','해안 도시 완성','해안 도시를 최고 레벨까지 키웠다'],['city2','산악 도시 완성','산악 도시를 최고 레벨까지 키웠다'],['hard','하드 모드 정복','하드 모드에서 레벨 5에 올랐다'],['sky','하늘을 찌르다','초고층 주상복합을 세웠다'],['upg20','리모델링 장인','건물을 20번 업그레이드했다']];
const B={
road:{n:'도로',c:'교통',cost:10,lv:1,open:1,road:1,ht:0,
  card:['사람과 물자를 실어 나르는 길','도로는 대표적인 토목 구조물입니다. 건설 기술은 크게 토목과 건축으로 나뉩니다. 토목은 도로·교량·터널·댐·상하수도처럼 국토를 편리하게 이용하기 위한 기반 시설을 만들고, 건축은 주택·학교·병원처럼 사람이 생활하는 공간을 만듭니다.','모든 건설 구조물은 기획 → 설계 → 시공 → 유지 관리의 순서로 만들어집니다. 다 지은 뒤에도 꾸준히 점검하고 고치는 유지 관리가 안전에 중요합니다.'],
  kw:['토목','건축','기획→설계→시공→유지 관리'],game:'건물은 시청과 이어진 도로에 맞닿아 있어야 작동합니다.',
  quiz:[{q:'도로, 교량, 터널, 댐처럼 국토를 효율적으로 이용하기 위한 기반 시설을 만드는 건설 분야는?',o:['토목','건축','조경','실내 디자인'],ex:'도로·교량·터널·댐·상하수도 등 사회 기반 시설을 만드는 분야는 토목입니다.'},
        {q:'건설 구조물이 만들어지는 과정을 순서대로 나열한 것은?',o:['기획 → 설계 → 시공 → 유지 관리','설계 → 기획 → 유지 관리 → 시공','시공 → 설계 → 기획 → 유지 관리','기획 → 시공 → 설계 → 유지 관리'],ex:'무엇을 지을지 정하고(기획), 도면을 그리고(설계), 실제로 짓고(시공), 점검·보수합니다(유지 관리).'}]},
bridge:{n:'교량',c:'교통',cost:60,lv:2,road:1,on:1,ht:30,
  card:['강과 계곡을 건너는 구조물','교량은 강, 바다, 계곡, 다른 도로 위를 건너갈 수 있게 만든 구조물입니다. 구조에 따라 여러 종류가 있습니다.','거더교는 교각 위에 보(거더)를 얹은 가장 기본적인 다리입니다. 아치교는 아치 모양으로 하중을 압축력으로 견딥니다. 트러스교는 부재를 삼각형으로 짜 맞춥니다. 사장교는 주탑에서 비스듬히 뻗은 케이블이 상판을 직접 붙잡고, 현수교는 주탑 사이에 늘어뜨린 주 케이블에 상판을 매답니다.'],
  kw:['거더교','아치교','트러스교','사장교','현수교'],game:'강 위에만 놓을 수 있습니다. 도로처럼 이어져 강 건너편을 개발할 수 있게 합니다.',
  quiz:[{q:'주탑에서 비스듬히 뻗은 케이블이 다리 상판을 직접 지지하는 교량은?',o:['사장교','거더교','아치교','트러스교'],ex:'사장교는 주탑과 상판을 케이블로 직접 연결합니다. 주 케이블에 상판을 매다는 현수교와 구별하세요.'},
        {q:'부재를 삼각형 모양으로 짜 맞추어 하중을 견디는 교량은?',o:['트러스교','현수교','거더교','사장교'],ex:'삼각형은 힘을 받아도 모양이 잘 변하지 않아 구조물에 널리 쓰입니다.'}]},
tunnel:{n:'터널',c:'교통',cost:120,lv:3,road:1,on:2,ht:34,
  card:['산과 땅속을 뚫는 길','터널은 산, 지하, 바다 밑을 뚫어 만든 통로입니다. 돌아가던 길을 곧게 이어 이동 거리와 시간을 줄여 줍니다.','발파 공법(NATM)은 화약으로 암반을 폭파한 뒤 록볼트와 숏크리트(뿜어 붙이는 콘크리트)로 벽을 보강하며 나아갑니다. TBM 공법은 원통형 대형 굴착 기계를 회전시켜 뚫는 방식으로, 소음과 진동이 적습니다.'],
  kw:['발파 공법(NATM)','TBM 공법','숏크리트'],game:'산 위에만 뚫을 수 있습니다. 산 너머 땅을 도로로 연결합니다.',
  quiz:[{q:'원통형 대형 굴착 기계를 회전시켜 터널을 뚫는 공법은?',o:['TBM 공법','발파 공법','침매 공법','개착 공법'],ex:'TBM(Tunnel Boring Machine) 공법은 기계로 굴착해 발파 공법보다 소음과 진동이 적습니다.'},
        {q:'터널을 건설했을 때 얻는 효과로 가장 알맞은 것은?',o:['이동 거리와 시간이 줄어든다','전기를 생산할 수 있다','홍수를 조절할 수 있다','하수를 정화할 수 있다'],ex:'터널은 산이나 바다를 돌아가지 않고 지나가게 해 수송 효율을 높입니다.'}]},
transit:{n:'환승 센터',c:'교통',cost:800,lv:4,ht:22,svc:['transit',5,8],jobs:5,pu:4,up:6,
  card:['여러 교통수단을 잇는 곳','수송 기술은 사람과 물건을 원하는 곳으로 옮기는 기술입니다. 버스·지하철 같은 대중교통은 한 번에 많은 사람을 태워 1인당 에너지 소비와 탄소 배출이 승용차보다 훨씬 적습니다.','최근에는 배터리의 전기로 달리는 전기 자동차, 수소와 산소를 반응시켜 만든 전기로 달리는 수소 연료 전지 자동차 같은 친환경 수송 수단이 늘고 있습니다.'],
  kw:['수송 기술','대중교통','전기 자동차','수소 연료 전지'],game:'주변 5칸 주택의 행복도를 8 올립니다.',
  quiz:[{q:'수소와 산소의 화학 반응으로 만든 전기로 모터를 돌려 달리는 자동차는?',o:['수소 연료 전지 자동차','디젤 자동차','가솔린 자동차','LPG 자동차'],ex:'수소 연료 전지 자동차는 주행 중 물만 배출합니다.'},
        {q:'대중교통을 이용했을 때의 효과로 알맞지 않은 것은?',o:['1인당 탄소 배출량이 늘어난다','도로 혼잡이 줄어든다','1인당 에너지 소비가 줄어든다','주차 공간 부족이 완화된다'],ex:'한 번에 많은 사람을 태우므로 1인당 탄소 배출량은 줄어듭니다.'}]},
house:{n:'단독 주택',c:'주거',cost:100,lv:1,open:1,cap:8,pu:2,wu:2,ht:26,
  card:['사람이 사는 건축 구조물','주택은 대표적인 건축 구조물입니다. 건축물은 여러 구조 요소가 힘을 나누어 받치고 있습니다.','기초는 건물 전체의 무게(하중)를 땅으로 전달합니다. 기둥은 위에서 내려오는 하중을 기초로 전달하고, 보는 기둥과 기둥 사이에 수평으로 놓여 바닥의 하중을 기둥으로 전달합니다. 여기에 바닥(슬래브), 벽, 지붕이 더해집니다.'],
  kw:['기초','기둥','보','바닥','벽','지붕'],game:'주택에는 전기와 물이 필요합니다. 주변 환경이 좋을수록 더 많은 사람이 삽니다.',
  quiz:[{q:'건축물 전체의 하중을 지반(땅)으로 전달하는 구조 요소는?',o:['기초','지붕','보','벽'],ex:'기초는 건물의 맨 아래에서 모든 하중을 땅으로 전달합니다.'},
        {q:'기둥과 기둥 사이에 수평으로 놓여 바닥의 하중을 기둥에 전달하는 구조 요소는?',o:['보','기초','지붕','창호'],ex:'보는 수평 부재, 기둥은 수직 부재입니다.'}]},
apt:{n:'중형 아파트',c:'주거',from:'villa',cost:600,lv:3,cap:40,pu:8,wu:8,ht:48,
  card:['철근 콘크리트로 높이 쌓다','아파트 같은 공동 주택은 좁은 땅에 많은 사람이 살 수 있게 합니다. 대부분 철근 콘크리트 구조로 짓습니다.','콘크리트는 누르는 힘(압축력)에는 강하지만 당기는 힘(인장력)에는 약합니다. 철근은 인장력에 강합니다. 콘크리트 속에 철근을 넣으면 서로의 약점을 보완해 튼튼한 구조가 됩니다.'],
  kw:['공동 주택','철근 콘크리트','압축력','인장력'],game:'단독 주택 5채만큼의 인구를 한 칸에 수용합니다. 전기와 물도 많이 씁니다.',
  quiz:[{q:'철근 콘크리트 구조에서 철근이 주로 보완해 주는 힘은?',o:['당기는 힘(인장력)','누르는 힘(압축력)','마찰력','부력'],ex:'콘크리트는 인장력에 약하므로 인장력에 강한 철근을 넣어 보완합니다.'},
        {q:'콘크리트가 잘 견디는 힘은?',o:['압축력','인장력','자기력','원심력'],ex:'콘크리트는 압축에 강하고 인장에 약합니다.'}]},
zero:{n:'제로 에너지 주택',c:'주거',cost:450,lv:4,cap:12,pu:0,wu:2,bonus:6,ht:26,
  card:['에너지를 스스로 만드는 집','제로 에너지 건축물은 쓰는 에너지를 최소로 줄이고, 필요한 에너지는 스스로 생산하는 건물입니다.','패시브 기술은 고단열 벽체, 고기밀 시공, 삼중 유리창 등으로 에너지가 새는 것을 막습니다. 액티브 기술은 태양광·지열 설비 등으로 에너지를 직접 만들어 냅니다.'],
  kw:['패시브 기술','액티브 기술','단열','지속 가능한 건설'],game:'전기를 쓰지 않고, 사는 사람의 행복도가 6 높습니다.',
  quiz:[{q:'단열과 기밀 성능을 높여 건물에서 에너지가 새는 것을 최소화하는 기술은?',o:['패시브 기술','액티브 기술','TBM 기술','발파 기술'],ex:'패시브는 에너지를 아끼는 기술, 액티브는 에너지를 만드는 기술입니다.'},
        {q:'제로 에너지 건축물의 액티브 기술에 해당하는 것은?',o:['지붕 태양광 발전 설비','두꺼운 단열재','삼중 유리창','고기밀 시공'],ex:'태양광·지열처럼 에너지를 생산하는 설비가 액티브 기술입니다.'}]},
shop:{n:'상가',c:'상업·산업',cost:200,lv:1,jobs:6,inc:12,pu:3,wu:1,ht:18,
  card:['도시의 땅은 쓰임새를 나눈다','도시는 땅의 쓰임새를 주거 지역, 상업 지역, 공업 지역, 녹지 지역 등으로 나누어 계획합니다. 이렇게 하면 토지를 효율적으로 쓰고 쾌적한 생활 환경을 지킬 수 있습니다.','상업 시설은 일자리와 물건을 살 곳을 제공합니다. 주택만 있는 도시는 일자리가 없어 살기 어렵습니다.'],
  kw:['주거 지역','상업 지역','공업 지역','녹지 지역'],game:'일자리 6개와 수입을 만듭니다. 일할 사람이 있어야 제 수입을 냅니다.',
  quiz:[{q:'도시의 땅을 주거·상업·공업·녹지 지역 등으로 나누어 계획하는 까닭은?',o:['토지를 효율적으로 이용하고 쾌적한 환경을 만들기 위해','건물을 모두 같은 모양으로 짓기 위해','도로를 없애기 위해','인구를 줄이기 위해'],ex:'용도에 맞게 땅을 나누면 소음·오염 피해를 줄이고 토지를 효율적으로 쓸 수 있습니다.'},
        {q:'다음 중 건축 구조물에 해당하는 것은?',o:['상가 건물','댐','교량','터널'],ex:'댐·교량·터널은 토목 구조물이고, 사람이 머무는 상가 건물은 건축 구조물입니다.'}]},
factory:{n:'공장',c:'상업·산업',cost:450,lv:2,jobs:16,inc:28,pu:8,wu:4,pol:6,polR:3,ht:36,
  card:['일자리와 오염 사이','공장은 많은 일자리와 수입을 만들지만 소음, 매연, 폐수가 발생합니다. 그래서 도시 계획에서는 공업 지역을 주거 지역과 떨어뜨려 배치합니다.','굴뚝의 집진 장치는 매연 속 먼지를 걸러 내고, 폐수 처리 시설은 오염된 물을 정화합니다. 기술은 편리함과 함께 환경 문제도 가져오므로 영향을 미리 평가해야 합니다.'],
  kw:['공업 지역','집진 장치','기술의 양면성'],game:'주변 3칸 주택의 행복도를 낮춥니다. 주택가와 떨어뜨려 지으세요.',
  quiz:[{q:'공장을 주택가와 떨어뜨려 배치하는 까닭은?',o:['소음과 대기 오염 피해를 줄이기 위해','공장의 전기 요금을 줄이기 위해','도로를 좁게 만들기 위해','건물 높이를 맞추기 위해'],ex:'공업 지역과 주거 지역을 분리하면 주민의 건강과 생활 환경을 지킬 수 있습니다.'},
        {q:'공장 굴뚝에서 매연 속 먼지를 걸러 내는 장치는?',o:['집진 장치','변압기','정수기','록볼트'],ex:'집진 장치는 배출 가스 속 먼지를 모아 제거합니다.'}]},
tower:{n:'랜드마크 타워',c:'상업·산업',cost:3000,lv:5,jobs:60,inc:90,pu:20,wu:10,ht:96,
  card:['바람과 지진을 이기는 초고층','초고층 건물은 바람과 지진에 크게 흔들릴 수 있습니다. 건물 위쪽에 무거운 추나 댐퍼를 달아 흔들림을 흡수하는 방식을 제진이라고 합니다.','복잡한 건물은 BIM으로 설계합니다. BIM은 건물의 3차원 모델에 설계·시공·유지 관리 정보를 모두 담아, 짓기 전에 문제를 미리 찾아냅니다.'],
  kw:['초고층','제진','BIM'],game:'일자리 60개와 큰 수입을 만드는 도시의 상징입니다.',
  quiz:[{q:'건물의 3차원 모델에 설계·시공·유지 관리 정보를 통합해 관리하는 기술은?',o:['BIM','GPS','TBM','NATM'],ex:'BIM(건설 정보 모델링)은 3차원 모델로 건설 전 과정을 관리합니다.'},
        {q:'건물에 추나 댐퍼를 설치해 흔들림을 흡수하는 방식은?',o:['제진','단열','방수','기밀'],ex:'내진은 튼튼하게 버티기, 면진은 흔들림 전달 줄이기, 제진은 흔들림 흡수하기입니다.'}]},
thermal:{n:'화력 발전소',c:'에너지',cost:500,lv:1,open:1,pw:40,up:5,pol:10,polR:3,ht:44,
  card:['화석 연료로 전기를 만든다','화력 발전은 석탄, 천연가스 같은 화석 연료를 태워 물을 끓이고, 그 증기로 터빈을 돌려 전기를 만듭니다. 에너지는 화학 에너지 → 열에너지 → 운동 에너지 → 전기 에너지로 바뀝니다.','날씨와 상관없이 많은 전기를 안정적으로 만들 수 있지만, 온실가스와 미세 먼지를 배출하고 연료가 언젠가 고갈된다는 단점이 있습니다.'],
  kw:['화석 연료','터빈','온실가스','에너지 변환'],game:'값싸게 전기 40을 만들지만 주변 3칸을 오염시키고 환경 점수를 낮춥니다.',

        {q:'화력 발전에서 일어나는 에너지 변환 순서는?',o:['화학 → 열 → 운동 → 전기','빛 → 전기','위치 → 운동 → 전기','전기 → 열 → 빛'],ex:'연료의 화학 에너지가 열, 터빈의 운동 에너지를 거쳐 전기 에너지가 됩니다.'}]},
solar:{n:'태양광 발전소',c:'에너지',cost:450,lv:2,pw:18,up:1,ren:1,ht:6,
  card:['빛을 바로 전기로','태양광 발전은 태양 전지가 빛 에너지를 전기 에너지로 직접 바꾸는 발전 방식입니다. 연료가 필요 없고 발전 과정에서 온실가스가 나오지 않는 신·재생 에너지입니다.','다만 밤이나 흐린 날에는 발전량이 줄고, 넓은 설치 면적이 필요합니다. 그래서 남는 전기를 저장하는 에너지 저장 장치(ESS)와 함께 쓰기도 합니다.'],
  kw:['신·재생 에너지','태양 전지','ESS'],game:'오염 없이 전기 18을 만듭니다. 신·재생 에너지 비율을 높입니다.',
  quiz:[{q:'태양 전지에서 일어나는 에너지 변환은?',o:['빛 에너지 → 전기 에너지','열에너지 → 운동 에너지','화학 에너지 → 열에너지','위치 에너지 → 운동 에너지'],ex:'태양광 발전은 터빈 없이 빛을 곧바로 전기로 바꿉니다.'},
        {q:'태양광 발전의 한계로 알맞은 것은?',o:['날씨와 시간에 따라 발전량이 달라진다','발전할 때 온실가스가 많이 나온다','연료비가 많이 든다','소음이 매우 크다'],ex:'햇빛이 약한 밤이나 흐린 날에는 발전량이 줄어듭니다.'}]},
wind:{n:'풍력 발전기',c:'에너지',cost:600,lv:3,pw:28,up:2,ren:1,ht:60,
  card:['바람으로 날개를 돌린다','풍력 발전은 바람의 운동 에너지로 날개(블레이드)를 돌리고, 그 회전으로 발전기를 돌려 전기를 만듭니다.','바람이 세고 일정하게 부는 해안이나 산간, 바다 위(해상 풍력)에 설치합니다. 온실가스를 배출하지 않지만 바람이 약하면 발전량이 줄어듭니다.'],

dam:{n:'다목적 댐',c:'에너지',cost:1500,lv:4,on:1,noRoad:1,pw:70,wt:40,up:6,ren:1,ht:16,prot:['rain',12],
  card:['물을 가두어 여러 일을 한다','댐은 하천을 가로막아 물을 저장하는 토목 구조물입니다. 다목적 댐은 홍수 조절, 생활·농업·공업용수 공급, 수력 발전을 함께 합니다.','수력 발전은 높은 곳에 있는 물의 위치 에너지가 떨어지면서 터빈을 돌리는 운동 에너지로, 다시 전기 에너지로 바뀌는 원리입니다.'],

        {q:'수력 발전에서 터빈을 돌리는 데 이용하는 에너지는?',o:['물의 위치 에너지','연료의 화학 에너지','바람의 운동 에너지','태양의 빛 에너지'],ex:'높은 곳의 물이 떨어지며 위치 에너지가 운동 에너지로 바뀝니다.'}]},
waterp:{n:'정수장',c:'물',cost:300,lv:1,open:1,wt:40,pu:3,up:2,ht:14,
  card:['깨끗한 물을 보내는 상수도','상수도는 강이나 호수의 물을 깨끗하게 만들어 가정과 공장에 보내는 시설입니다.','취수장에서 끌어온 물은 정수장에서 약품으로 불순물을 엉기게 하고(응집), 가라앉히고(침전), 모래층으로 거르고(여과), 염소로 세균을 없앤(소독) 뒤 배수지를 거쳐 각 가정으로 갑니다.'],

sewage:{n:'하수 처리장',c:'물',cost:350,lv:1,sw:50,pu:3,up:2,ht:10,
  card:['쓰고 난 물을 되살리는 하수도','가정과 공장에서 쓰고 버린 물(하수)은 하수관을 따라 하수 처리장으로 모입니다.','먼저 모래와 찌꺼기를 가라앉히고, 생물 반응조에서 미생물이 오염 물질을 분해하게 한 다음, 다시 가라앉히고 소독해 하천으로 내보냅니다. 하수를 그대로 흘려보내면 강과 바다가 오염됩니다.'],

park:{n:'공원',c:'공공·환경',cost:80,lv:1,noRoad:1,svc:['park',2,8],abs:2,up:1,ht:14,
  card:['도시의 허파, 녹지','공원과 숲 같은 녹지는 미세 먼지를 흡수하고 시민에게 쉴 곳을 줍니다.','건물과 아스팔트가 많은 도심은 주변보다 기온이 높아지는데, 이를 열섬 현상이라고 합니다. 녹지와 옥상 녹화는 열섬 현상을 줄이고, 건물의 단열 효과를 높여 냉난방 에너지도 아껴 줍니다.'],

school:{n:'학교',c:'공공·환경',cost:400,lv:2,svc:['edu',4,10],pu:3,wu:2,up:5,ht:30,
  card:['지진에도 안전해야 하는 공공 건축물','학교는 많은 사람이 이용하고 재난 때 대피소로도 쓰여 특히 안전해야 합니다.','내진 설계는 기둥과 벽을 튼튼히 해 지진에 버티게 하는 것입니다. 면진은 건물과 땅 사이에 고무 받침 같은 장치를 넣어 흔들림이 건물로 덜 전달되게 하고, 제진은 댐퍼로 흔들림을 흡수합니다.'],

hospital:{n:'병원',c:'공공·환경',cost:700,lv:3,svc:['med',5,12],pu:6,wu:4,up:8,ht:32,
  card:['누구나 이용할 수 있는 설계','병원 같은 공공시설은 장애인, 노인, 어린이, 임산부 누구나 편하게 이용할 수 있어야 합니다. 이렇게 모든 사람을 고려한 설계를 유니버설 디자인이라고 합니다.','문턱 없는 출입구, 완만한 경사로, 넓은 엘리베이터, 점자 블록, 낮은 세면대가 그 예입니다.'],

fire:{n:'소방서',c:'공공·환경',cost:400,lv:3,svc:['fire',5,6],pu:2,wu:1,up:4,ht:34,
  card:['건물 속 화재 안전 기술','건물에는 불이 났을 때 피해를 줄이는 설비가 들어 있습니다. 스프링클러는 열을 감지해 자동으로 물을 뿌리고, 방화문과 방화 구획은 불과 연기가 퍼지는 것을 막습니다.','불이 나면 엘리베이터는 멈추거나 연기가 찰 수 있으므로 반드시 피난 계단으로 대피합니다.'],

recycle:{n:'자원 순환 센터',c:'공공·환경',cost:700,lv:4,abs:10,jobs:6,pu:4,up:4,ht:18,
  card:['버리지 않고 다시 쓰는 건설','지속 가능한 건설은 미래 세대도 자원과 환경을 누릴 수 있도록 짓는 것입니다.','건물을 헐 때 나오는 폐콘크리트를 잘게 부수어 다시 건설 재료로 쓰는 것을 순환 골재라고 합니다. 건설 폐기물을 줄이고(Reduce), 다시 쓰고(Reuse), 재활용(Recycle)하면 자원과 에너지를 아낄 수 있습니다.'],
  kw:['지속 가능한 건설','순환 골재','재활용'],game:'도시 전체의 오염을 10만큼 줄여 환경 점수를 올립니다.',

smart:{n:'스마트 시티 센터',c:'공공·환경',cost:2000,lv:5,smart:1,jobs:10,pu:10,up:10,ht:46,
  card:['정보 통신 기술로 도시를 관리한다','스마트 시티는 정보 통신 기술로 교통, 에너지, 안전 문제를 해결하는 도시입니다. 도로와 건물의 센서가 인터넷으로 연결된 사물 인터넷(IoT)이 정보를 모으고, 이를 분석해 신호등과 전력을 조절합니다.','스마트 그리드는 전력망에 정보 통신 기술을 더해 전기의 생산량과 사용량을 실시간으로 맞추는 차세대 전력망입니다.'],
  kw:['스마트 시티','사물 인터넷(IoT)','스마트 그리드'],game:'도시 전체의 전기·물 사용량을 15% 줄입니다.',

        {q:'사물에 센서와 통신 기능을 넣어 인터넷으로 서로 연결하는 기술은?',o:['사물 인터넷(IoT)','BIM','TBM','ESS'],ex:'사물 인터넷은 스마트 시티의 기반 기술입니다.'}]},
ess:{n:'에너지 저장 장치',c:'에너지',cost:500,lv:3,ess:25,up:2,ht:14,
  card:['남는 전기를 모아 두었다가 쓴다','태양광과 풍력은 날씨와 계절에 따라 발전량이 들쭉날쭉합니다. 흐린 날과 겨울에는 태양광이, 바람이 약한 날에는 풍력이 줄어듭니다. 에너지 저장 장치(ESS)는 전기가 남을 때 커다란 배터리에 모아 두었다가 모자랄 때 꺼내 씁니다.','신·재생 에너지를 많이 쓰는 도시일수록 저장 장치가 중요합니다. 전기를 만드는 곳, 쓰는 곳, 저장하는 곳을 정보 통신 기술로 연결해 실시간으로 조절하는 것이 스마트 그리드입니다.'],
  kw:['ESS','배터리','신·재생 에너지 보완'],game:'날씨와 계절 때문에 줄어든 태양광·풍력 발전량을 25까지 메워 줍니다.',
  quiz:[{q:'전기가 남을 때 저장했다가 모자랄 때 꺼내 쓰는 장치는?',o:['에너지 저장 장치(ESS)','변압기','터빈','집진 장치'],ex:'ESS는 신·재생 에너지의 들쭉날쭉한 발전량을 보완합니다.'},
        {q:'에너지 저장 장치와 함께 쓰면 특히 좋은 발전 방식은?',o:['태양광·풍력 발전','화력 발전','디젤 발전','가스 발전'],ex:'태양광과 풍력은 날씨에 따라 발전량이 달라서 저장 장치와 함께 쓰면 안정적입니다.'}]},
villa:{n:'다세대 주택',c:'주거',cost:250,lv:2,cap:16,pu:3,wu:3,ht:24,from:'house',
  card:['여러 가구가 함께 사는 작은 공동 주택','공동 주택은 한 건물에 여러 가구가 함께 사는 주택입니다. 우리나라 건축법은 층수와 넓이로 공동 주택을 나눕니다. 주택으로 쓰는 층이 4개 층 이하이면서 바닥 면적 합계가 660㎡ 이하이면 다세대 주택, 660㎡를 넘으면 연립 주택, 5개 층 이상이면 아파트입니다.','단독 주택을 다세대 주택으로 다시 지으면 같은 땅에 더 많은 사람이 살 수 있습니다. 대신 주차 공간과 햇빛이 드는 정도를 함께 따져야 합니다.'],
  kw:['공동 주택','다세대 주택','연립 주택'],game:'단독 주택 2채만큼 살 수 있습니다. 업그레이드 도구로 단독 주택을 바꿀 수 있습니다.',
  quiz:[{q:'주택으로 쓰는 층이 5개 층 이상인 공동 주택은?',o:['아파트','다세대 주택','연립 주택','단독 주택'],ex:'4개 층 이하는 바닥 면적에 따라 다세대 주택이나 연립 주택, 5개 층 이상은 아파트입니다.'},
        {q:'다세대 주택과 연립 주택을 나누는 기준은?',o:['바닥 면적 합계 (660㎡)','지붕 모양','외벽 색깔','창문 개수'],ex:'둘 다 4개 층 이하이고, 바닥 면적 합계가 660㎡ 이하면 다세대 주택, 넘으면 연립 주택입니다.'}]},
aptH:{n:'고층 아파트',c:'주거',cost:1300,lv:4,cap:90,pu:16,wu:14,ht:70,from:'apt',
  card:['높이 올라갈수록 새 기술이 필요하다','우리나라 건축법에서는 30층 이상이거나 높이 120m 이상인 건축물을 고층 건축물, 50층 이상이거나 높이 200m 이상인 건축물을 초고층 건축물이라고 합니다.','건물이 높아지면 사람과 물을 높이 올려야 합니다. 고속 엘리베이터가 사람을 나르고, 가압 펌프가 물을 꼭대기 층까지 밀어 올립니다. 높은 곳일수록 바람이 세서 바람의 힘도 꼼꼼히 계산해 설계합니다.'],
  kw:['고층 건축물','엘리베이터','가압 펌프'],game:'중형 아파트에서 업그레이드할 수 있습니다. 높은 건물이라 지진에 약하니 내진 기술을 갖추세요.',
  quiz:[{q:'우리나라 건축법에서 초고층 건축물의 기준은?',o:['50층 이상 또는 높이 200m 이상','10층 이상','20층 이상 또는 높이 60m 이상','100층 이상'],ex:'30층 이상 또는 120m 이상은 고층, 50층 이상 또는 200m 이상은 초고층 건축물입니다.'},

aptL:{n:'대형 아파트 단지',c:'주거',cost:3200,lv:4,sz:2,cap:240,bonus:5,pu:40,wu:36,ht:38,
  card:['여러 동을 함께 계획하는 단지','아파트 단지는 여러 동의 건물과 놀이터, 산책로, 주차장을 한꺼번에 계획합니다. 동과 동 사이는 겨울에도 햇빛이 들도록 일정한 거리를 띄우는데, 이렇게 햇빛을 받을 권리를 일조권이라고 합니다.','요즘 단지는 자동차를 지하 주차장에 두고 지상을 공원처럼 꾸며 아이들이 안전하게 뛰어놀 수 있게 합니다.'],
  kw:['단지 계획','일조권','지하 주차장'],game:'2×2칸을 차지합니다. 240명이 살고, 단지 안 조경 덕분에 사는 사람의 행복도가 5 높습니다.',
  quiz:[{q:'건물 사이를 띄워 햇빛을 받을 수 있게 보장하는 권리는?',o:['일조권','초상권','저작권','통행권'],ex:'일조권을 지키려고 건물 사이 거리와 높이를 법으로 정합니다.'},
        {q:'단지 지상을 공원처럼 꾸미기 위해 자동차를 주로 두는 곳은?',o:['지하 주차장','옥상','놀이터','단지 앞 도로'],ex:'차를 지하로 보내면 지상이 넓고 안전해집니다.'}]},
aptS:{n:'초고층 주상복합',c:'주거',cost:7000,lv:5,sz:2,cap:500,jobs:60,inc:120,pu:90,wu:70,ht:96,
  card:['아래는 상가, 위는 집','주상복합 건물은 아래층에 상가와 사무실이, 위층에 주택이 있는 건물입니다. 집 가까이에서 일하고 장을 볼 수 있어 이동이 줄어듭니다.','초고층 건물은 가운데에 엘리베이터와 계단을 모은 튼튼한 코어를 세우고, 그 둘레에 기둥을 세워 바람과 지진의 힘을 버팁니다. 불이 났을 때를 대비해 초고층 건물에는 30개 층마다 사람들이 잠시 대피할 수 있는 피난 안전 구역을 둡니다.'],
  kw:['주상복합','코어','피난 안전 구역'],game:'2×2칸을 차지합니다. 500명이 살고 일자리 60개와 수입도 만듭니다.',
  quiz:[{q:'아래층에 상가, 위층에 주택이 있는 건물은?',o:['주상복합 건물','다세대 주택','연립 주택','단독 주택'],ex:'주거와 상업이 한 건물에 함께 있어 주상복합이라고 합니다.'},
        {q:'초고층 건물 가운데에 엘리베이터와 계단을 모아 세운 튼튼한 구조는?',o:['코어','커튼월','거푸집','방파제'],ex:'코어는 건물의 척추처럼 바람과 지진의 힘을 받아 냅니다.'}]},
shopM:{n:'중형 상가',c:'상업·산업',cost:450,lv:2,jobs:14,inc:28,pu:5,wu:2,ht:24,from:'shop',
  card:['생활에 필요한 가게를 가까이','동네 주민이 날마다 이용하는 가게, 의원, 학원 같은 시설을 근린 생활 시설이라고 합니다. 걸어서 갈 수 있는 거리에 두면 자동차 이용이 줄고 동네가 활기차집니다.','여러 층 상가는 1층에 사람이 많이 드나드는 가게를, 위층에 학원이나 사무실을 두는 식으로 층마다 쓰임을 나누어 계획합니다.'],
  kw:['근린 생활 시설','도보 생활권'],game:'상가에서 업그레이드할 수 있습니다. 일자리 14개를 만듭니다.',
  quiz:[{q:'주민의 일상생활에 필요한 가게나 의원 같은 시설을 묶어 부르는 말은?',o:['근린 생활 시설','업무 시설','공업 시설','발전 시설'],ex:'근린은 가까운 이웃이라는 뜻입니다.'},
        {q:'생활 시설을 걸어갈 수 있는 거리에 두면 좋은 점은?',o:['자동차 이용이 줄어든다','전기가 생산된다','지진이 줄어든다','강물이 불어난다'],ex:'걸어서 해결할 수 있으면 교통 혼잡과 배기가스가 줄어듭니다.'}]},
office:{n:'오피스 빌딩',c:'상업·산업',cost:900,lv:3,jobs:35,inc:70,pu:10,wu:4,ht:58,from:'shopM',
  card:['유리로 감싼 빌딩의 비밀','도심의 오피스 빌딩은 겉이 유리와 금속 판으로 덮인 경우가 많습니다. 이런 외벽을 커튼월이라고 합니다. 커튼처럼 골조에 매달아 붙이는 벽이라서 건물의 무게를 받치지 않고, 무게는 안쪽의 기둥과 보가 받칩니다.','커튼월은 공장에서 미리 만든 판을 현장에서 조립해 공사 기간을 줄일 수 있습니다. 대신 유리 면이 넓으면 여름에 더워지기 쉬워 단열 성능이 높은 유리와 햇빛 가리개를 함께 씁니다.'],
  kw:['커튼월','조립식 공법'],game:'중형 상가에서 업그레이드할 수 있습니다. 일자리 35개와 큰 수입을 만듭니다.',
  quiz:[{q:'골조에 매달아 붙여 건물의 무게를 받치지 않는 유리·금속 외벽은?',o:['커튼월','내력벽','옹벽','제방'],ex:'커튼월은 무게를 받치지 않는 벽이라 얇고 가볍게 만들 수 있습니다.'},
        {q:'커튼월 건물에서 건물의 무게를 받치는 것은?',o:['안쪽의 기둥과 보','바깥 유리창','외벽 금속 판','블라인드'],ex:'커튼월 건물의 무게는 안쪽 골조인 기둥과 보가 받칩니다.'}]},
mall:{n:'대형 쇼핑몰',c:'상업·산업',cost:3000,lv:4,sz:2,jobs:80,inc:170,pu:24,wu:8,ht:24,
  card:['기둥 없는 넓은 공간','대형 쇼핑몰이나 공항처럼 넓은 공간에는 기둥을 많이 세우기 어렵습니다. 그래서 철골 부재를 삼각형으로 짜 맞춘 트러스, 이것을 입체로 엮은 스페이스 프레임으로 넓은 지붕을 받칩니다.','큰 시설은 많은 차와 사람을 불러 모읍니다. 그래서 짓기 전에 주변 교통이 얼마나 막힐지 미리 따져 보는 교통 영향 평가를 받습니다. 건설 계획 단계의 교통 계획과 이어지는 내용입니다.'],
  kw:['스페이스 프레임','트러스','교통 영향 평가'],game:'2×2칸을 차지합니다. 일자리 80개와 아주 큰 수입을 만듭니다.',
  quiz:[{q:'철골 부재를 입체로 엮어 기둥 없이 넓은 지붕을 받치는 구조는?',o:['스페이스 프레임','조적식 구조','독립 기초','커튼월'],ex:'스페이스 프레임은 삼각형 트러스를 입체로 이어 가볍고 튼튼합니다.'},
        {q:'큰 시설을 짓기 전에 주변 교통에 미칠 영향을 미리 따져 보는 것은?',o:['교통 영향 평가','담수 시험','침하 시험','절연 검사'],ex:'교통 영향 평가 결과에 따라 진입로를 넓히거나 주차장을 늘립니다.'}]},
smartF:{n:'스마트 공장',c:'상업·산업',cost:1400,lv:4,jobs:24,inc:55,pu:12,wu:4,pol:2,polR:2,ht:16,from:'factory',
  card:['데이터로 돌아가는 공장','스마트 공장은 기계와 설비에 센서를 달아 사물 인터넷으로 연결하고, 모은 데이터를 인공지능으로 분석해 생산을 자동으로 조절하는 공장입니다.','불량품과 버려지는 재료가 줄고, 필요한 만큼만 기계를 돌려 에너지와 오염 물질도 줄일 수 있습니다.'],
  kw:['스마트 공장','사물 인터넷','자동화'],game:'공장에서 업그레이드할 수 있습니다. 일자리와 수입은 늘고 오염은 크게 줄어듭니다.',
  quiz:[{q:'센서와 사물 인터넷, 인공지능으로 생산을 자동 조절하는 공장은?',o:['스마트 공장','수공업 공방','가내 공장','증기 기관 공장'],ex:'스마트 공장은 데이터를 바탕으로 스스로 생산을 조절합니다.'},
        {q:'스마트 공장의 특징으로 알맞지 않은 것은?',o:['오염 물질이 늘어난다','불량품이 줄어든다','에너지를 아낀다','생산을 자동으로 조절한다'],ex:'필요한 만큼만 생산해 에너지와 오염 물질이 줄어듭니다.'}]},
lng:{n:'LNG 복합 화력 발전소',c:'에너지',cost:1100,lv:3,pw:75,up:9,pol:4,polR:2,ht:40,from:'thermal',
  card:['더 깨끗하고 효율 높은 화력 발전','천연가스는 석탄보다 탈 때 이산화 탄소와 미세 먼지가 적게 나오는 화석 연료입니다. 운반하기 쉽게 아주 차갑게 식혀 액체로 만든 것을 액화 천연가스(LNG)라고 합니다.','복합 화력 발전은 가스를 태워 가스 터빈을 돌린 뒤, 버려지던 뜨거운 배기가스의 열로 물을 끓여 증기 터빈을 한 번 더 돌립니다. 같은 연료로 더 많은 전기를 만들 수 있습니다.'],
  kw:['LNG','복합 화력','가스 터빈'],game:'화력 발전소에서 업그레이드할 수 있습니다. 전기는 더 많이, 오염은 훨씬 적게 만듭니다.',
  quiz:[{q:'복합 화력 발전이 효율이 높은 까닭은?',o:['배기가스의 열로 증기 터빈을 한 번 더 돌려서','연료를 쓰지 않아서','햇빛을 이용해서','바람을 이용해서'],ex:'버려지던 열을 다시 써서 같은 연료로 더 많은 전기를 만듭니다.'},
        {q:'천연가스를 아주 차갑게 식혀 액체로 만든 것은?',o:['LNG','ESS','BIM','TBM'],ex:'LNG는 액화 천연가스의 줄임말입니다.'}]},
windM:{n:'산악 풍력 발전 단지',c:'에너지',cost:700,lv:3,on:2,noRoad:1,pw:32,up:2,ren:1,pk:'wind',ht:70,
  card:['산 능선의 바람을 잡는다','산 능선은 바람을 막는 것이 없어 바람이 세고 일정하게 붑니다. 그래서 풍력 발전기를 산 위에 줄지어 세우기도 합니다.','다만 산에 발전기를 세우려면 길을 내고 나무를 베어야 하므로, 산림과 동물에 주는 영향을 미리 조사하는 환경 영향 평가를 거칩니다.'],
  kw:['산악 풍력','능선','환경 영향 평가'],game:'산 위에만 세울 수 있습니다. 평지 풍력보다 전기를 더 만듭니다. 도로가 없어도 됩니다.',
  quiz:[{q:'산 능선에 풍력 발전기를 세우는 까닭은?',o:['바람이 세고 일정하게 불어서','물이 많아서','햇빛이 강해서','땅속이 따뜻해서'],ex:'바람을 막는 것이 없는 능선은 풍력 발전에 유리합니다.'},
        {q:'개발하기 전에 자연환경에 미칠 영향을 미리 조사하는 것은?',o:['환경 영향 평가','준공 검사','담수 시험','절연 검사'],ex:'환경 영향 평가 결과에 따라 위치나 공사 방법을 바꾸기도 합니다.'}]},
offshore:{n:'해상 풍력 발전소',c:'에너지',cost:1500,lv:4,on:3,noRoad:1,pw:70,up:5,ren:1,pk:'sea',ht:60,
  card:['바다 위의 바람 농장','바다 위는 바람을 막는 건물이나 산이 없어 육지보다 바람이 세고 고르게 붑니다. 그래서 큰 풍력 발전기를 바다에 세우는 해상 풍력이 늘고 있습니다.','얕은 바다에서는 바닥에 기초를 박는 고정식, 깊은 바다에서는 물에 떠 있는 구조물을 줄로 바닥에 묶는 부유식으로 짓습니다.'],
  kw:['해상 풍력','고정식','부유식'],game:'바다 위에만 지을 수 있습니다. 바람이 약한 날에도 발전량이 덜 줄어듭니다.',
  quiz:[{q:'깊은 바다에서 물에 떠 있는 구조물에 발전기를 세우는 방식은?',o:['부유식','고정식','개착식','조적식'],ex:'부유식은 떠 있는 구조물을 줄로 바다 밑에 고정합니다.'},
        {q:'바다 위 풍력 발전이 육지보다 유리한 점은?',o:['바람을 막는 것이 없어 바람이 세고 고르다','연료를 많이 쓴다','밤에만 발전한다','건설비가 아주 싸다'],ex:'대신 바다 위 공사라 건설비가 많이 듭니다.'}]},
hydro:{n:'수력 발전소',c:'에너지',cost:900,lv:3,on:1,noRoad:1,pw:30,up:3,ren:1,ht:16,
  card:['흐르는 강물로 전기를','수력 발전은 높은 곳의 물이 떨어지거나 흐르면서 수차(물이 돌리는 터빈)를 돌려 전기를 만듭니다. 물의 위치 에너지가 운동 에너지로, 다시 전기 에너지로 바뀝니다.','큰 댐 없이 강에 낮은 보를 쌓아 만드는 작은 수력 발전소는 짓기 쉽고 주변 환경을 덜 바꿉니다. 발전량은 물이 떨어지는 높이(낙차)와 흐르는 물의 양(유량)이 클수록 많아집니다.'],
  kw:['수차','낙차','유량'],game:'강 위에만 지을 수 있습니다. 오염 없이 날씨와 상관없이 전기 30을 만듭니다.',
  quiz:[{q:'수력 발전량이 많아지는 조건은?',o:['낙차와 유량이 크다','햇빛이 강하다','바람이 세다','기온이 높다'],ex:'떨어지는 높이와 물의 양이 클수록 위치 에너지가 커집니다.'},
        {q:'수력 발전소에서 물의 힘으로 도는 장치는?',o:['수차','집진기','댐퍼','변압기'],ex:'수차가 돌면서 발전기를 돌립니다.'}]},
nuclear:{n:'원자력 발전소',c:'에너지',cost:9000,lv:5,sz:2,water:1,pw:450,up:60,ht:36,
  card:['적은 연료로 많은 전기를','원자력 발전은 우라늄의 원자핵이 쪼개질 때(핵분열) 나오는 열로 물을 끓이고, 그 증기로 터빈을 돌려 전기를 만듭니다. 적은 연료로 많은 전기를 날씨와 상관없이 만들고, 발전할 때 이산화 탄소가 거의 나오지 않습니다.','한편 다 쓴 연료(사용후 핵연료)는 방사선을 내기 때문에 아주 오랫동안 안전하게 보관해야 하고, 사고를 막기 위한 여러 겹의 안전 설비와 철저한 관리가 필요합니다. 증기를 식힐 냉각수가 많이 필요해 바닷가나 큰 강가에 짓습니다.'],
  kw:['핵분열','사용후 핵연료','냉각수'],game:'2×2칸을 차지하고 강이나 바다에 맞닿아야 합니다. 전기 450을 만들지만 안전 관리비(유지비)가 큽니다.',
  quiz:[{q:'원자력 발전에서 열을 얻는 원리는?',o:['우라늄 원자핵의 핵분열','석탄의 연소','햇빛의 흡수','바람의 운동'],ex:'원자핵이 쪼개질 때 나오는 열로 물을 끓입니다.'},
        {q:'원자력 발전소를 바닷가나 큰 강가에 짓는 까닭은?',o:['증기를 식힐 냉각수가 많이 필요해서','배로 출근하려고','바람을 이용하려고','햇빛이 강해서'],ex:'터빈을 돌린 증기를 다시 물로 식히는 데 많은 물이 필요합니다.'}]},
hydrogen:{n:'수소 연료 전지 발전소',c:'에너지',cost:1600,lv:4,pw:50,up:6,ht:20,
  card:['수소와 산소로 전기를','연료 전지는 수소와 공기 중의 산소를 화학 반응시켜 전기를 만드는 장치입니다. 연료를 태우지 않아 소음과 오염 물질이 거의 없고, 반응하고 나면 물이 나옵니다.','좁은 땅에도 지을 수 있어 도심 가까이에서 전기를 만들 수 있습니다. 다만 수소를 만드는 데도 에너지가 들기 때문에 수소를 어떤 방법으로 만드는지가 중요합니다.'],
  kw:['연료 전지','수소','화학 에너지'],game:'오염 없이 날씨와 상관없이 전기 50을 만듭니다.',
  quiz:[{q:'연료 전지에서 수소와 산소가 반응하고 나면 나오는 것은?',o:['물','석탄재','이산화 황','매연'],ex:'수소와 산소가 만나 물이 됩니다.'},
        {q:'연료 전지에서 일어나는 에너지 변환은?',o:['화학 에너지 → 전기 에너지','빛 에너지 → 전기 에너지','위치 에너지 → 운동 에너지','운동 에너지 → 열에너지'],ex:'연료의 화학 에너지가 태우는 과정 없이 바로 전기로 바뀝니다.'}]},
solarF:{n:'태양광 발전 단지',c:'에너지',cost:1600,lv:4,sz:2,pw:80,up:3,ren:1,pk:'sol',ht:6,
  card:['넓은 땅에 펼친 태양광','태양광 발전 단지는 많은 태양광 패널을 넓은 땅에 줄지어 세운 발전소입니다. 우리나라에서는 햇빛을 가장 많이 받도록 패널을 남쪽을 향해 비스듬히 기울여 세웁니다.','넓은 땅이 필요하다는 단점을 줄이려고 저수지 물 위에 띄우는 수상 태양광, 건물 지붕과 벽에 붙이는 건물 일체형 태양광도 쓰입니다.'],
  kw:['태양광 단지','남향 설치','수상 태양광'],game:'2×2칸을 차지합니다. 전기 80을 만들지만 흐린 날과 겨울에는 발전량이 줄어듭니다.',
  quiz:[{q:'우리나라에서 태양광 패널을 주로 어느 쪽을 향해 세울까요?',o:['남쪽','북쪽','동쪽','서쪽'],ex:'북반구에서는 해가 남쪽 하늘을 지나기 때문입니다.'},

waterp2:{n:'고도 정수 처리장',c:'물',cost:900,lv:3,wt:110,pu:6,up:5,ht:20,from:'waterp',
  card:['한 번 더 걸러 내는 정수','고도 정수 처리는 일반 정수 과정(응집, 침전, 여과, 소독)에 단계를 더해 물을 더 깨끗하게 만드는 방법입니다.','오존을 넣어 냄새를 일으키는 물질과 미생물을 분해하고, 숯처럼 구멍이 많은 활성탄으로 남은 미량의 오염 물질을 흡착해 걸러 냅니다.'],
  kw:['고도 정수 처리','오존','활성탄'],game:'정수장에서 업그레이드할 수 있습니다. 물 110을 공급합니다.',

        {q:'고도 정수 처리에서 냄새 물질을 분해하려고 넣는 기체는?',o:['오존','수소','질소','헬륨'],ex:'오존은 산화력이 강해 냄새 물질과 미생물을 분해합니다.'}]},
sewage2:{n:'물 재이용 센터',c:'물',cost:1100,lv:4,sw:140,wt:25,pu:6,up:5,ht:16,from:'sewage',
  card:['하수를 다시 쓰는 물로','하수 처리장에서 깨끗해진 물을 한 번 더 정화하면 공장의 공업용수, 공원의 조경용수, 화장실 세척수 등으로 다시 쓸 수 있습니다. 이것을 물 재이용이라고 합니다.','물을 다시 쓰면 강에서 끌어오는 물이 줄어 가뭄에 대비할 수 있고, 하천으로 내보내는 오염도 줄어듭니다.'],

  quiz:[{q:'하수 처리수를 다시 정화해 공업용수나 조경용수로 쓰는 것은?',o:['물 재이용','담수 시험','취수','양생'],ex:'물 재이용은 버리던 물을 자원으로 바꿉니다.'},

bigpark:{n:'대형 공원',c:'공공·환경',cost:500,lv:3,sz:2,noRoad:1,svc:['park',5,12],abs:5,up:2,ht:16,
  card:['도시에 바람길을 내는 숲','도시 숲과 큰 공원의 나무는 미세 먼지를 걸러 내고, 그늘과 잎에서 일어나는 수분 증발로 주변 기온을 낮춥니다.','산과 강에서 불어오는 시원한 바람이 도심까지 흘러들도록 공원과 녹지를 이어 놓은 길을 바람길이라고 합니다. 바람길은 더운 공기와 오염된 공기를 밀어내 열섬 현상을 줄입니다.'],
  kw:['도시 숲','바람길','열섬 현상'],game:'2×2칸을 차지합니다. 반경 5칸 주택의 행복도를 12 올리고 오염을 흡수합니다. 도로가 없어도 됩니다.',
  quiz:[{q:'바깥의 시원한 바람이 도심까지 흘러들도록 녹지를 이어 놓은 길은?',o:['바람길','자전거 길','지하도','고가 도로'],ex:'바람길은 도시의 더운 공기와 오염된 공기를 밀어냅니다.'},

library:{n:'공공 도서관',c:'공공·환경',cost:600,lv:3,svc:['lib',6,8],pu:3,up:3,ht:26,

  {const iv=DF().int;S.nextDis=S.tick+iv[0]+Math.floor(Math.random()*(iv[1]-iv[0]))}
  const w=M.dis,se=season(),wt={rain:w.rain*(se===1?2:1),surge:w.surge*(se===1||se===2?1.6:1),quake:w.quake,fire:w.fire*(se===3||se===0?1.5:1)};
  if(!Object.keys(S.b).some(k=>!immune(S.b[k],B[S.b[k].t])))wt.fire=0;
  let r=Math.random()*(wt.rain+wt.surge+wt.quake+wt.fire),k='rain';for(const kk of ['rain','surge','quake','fire']){if(r<wt[kk]){k=kk;break}r-=wt[kk]}

}
function buildProt(kind){const p=new Uint8Array(N*N);for(const k in S.b){const c=S.b[k],b=B[c.t];if(b.prot&&b.prot[0]===kind&&!c.dmg){const x=k%N,y=(k/N)|0,r=b.prot[1],R=Math.ceil(r);
    for(let dy=-R;dy<=R;dy++)for(let dx=-R;dx<=R;dx++){const a=x+dx,bb=y+dy;if(a>=0&&bb>=0&&a<N&&bb<N&&dx*dx+dy*dy<=r*r)p[bb*N+a]=1}}}return p}

function canPlace(t,x,y){
  const b=B[t],sz=b.sz||1,need=b.on||0;
  for(let j=0;j<sz;j++)for(let i=0;i<sz;i++){const a=x+i,cc=y+j;
    if(a>=N||cc>=N||!inZone(a,cc))return sz>1?'2×2칸이 모두 열린 지역 안에 있어야 합니다':'아직 열리지 않은 지역입니다. 레벨이 오르면 넓어집니다';
    if(cell(a,cc))return sz>1?'2×2칸이 모두 비어 있어야 합니다':'이미 구조물이 있습니다';
    const tr=terr[cc*N+a];
    if(tr!==need){
      if(need)return b.n+'은(는) '+['','강 위에만 지을',b.road?'산에만 뚫을':'산 위에만 지을','바다 위에만 지을'][need]+' 수 있습니다';
      if(tr===1)return '강 위에는 교량, 댐, 수력 발전소만 지을 수 있습니다';
      if(tr===2)return '산에는 터널과 산악 풍력 발전 단지만 지을 수 있습니다';
      return '바다 위에는 방파제와 해상 풍력 발전소만 지을 수 있습니다';
    }}
  if(b.water){let ok=false;for(let j=-1;j<=sz;j++)for(let i=-1;i<=sz;i++){const a=x+i,cc=y+j;if(a>=0&&cc>=0&&a<N&&cc<N){const tr=terr[cc*N+a];if(tr===1||tr===3)ok=true}}
    if(!ok)return b.n+'은(는) 냉각수를 얻을 수 있게 강이나 바다에 맞닿아야 합니다'}
  if(S.money<b.cost)return '예산이 부족합니다 ('+b.cost.toLocaleString()+'원 필요)';
  return '';
}
function upgradeAt(x,y,to){if(visiting)return false;const k=keyAt(x,y);if(k<0)return false;const c=S.b[k],list=upsOf(c.t);
  if(!list.length){toast(B[c.t].n+'은(는) 업그레이드할 수 없습니다',true);return false}
  if(c.dmg){toast('먼저 피해를 복구해야 업그레이드할 수 있습니다',true);return false}
  const nx=to||list[0],nb=B[nx];
  if(S.level<nb.lv){toast(nb.n+'(으)로 바꾸려면 레벨 '+nb.lv+'이 되어야 합니다',true);return false}
  if(!S.un[nx]){showCard(nx,true);return false}
  const cost=upCost(c.t,nx);if(S.money<cost){toast('예산이 부족합니다 ('+cost.toLocaleString()+'원 필요)',true);return false}
  const old=B[c.t].n;S.money-=cost;c.t=nx;S.upN=(S.upN||0)+1;recompute();checkMission();updateUI();toast(old+' → '+nb.n+' 업그레이드 완료');return true}
function place(t,x,y,quiet){
  const why=canPlace(t,x,y);

}
function doze(x,y){

const TCODE=['hall','road','bridge','tunnel','transit','house','apt','zero','shop','factory','tower','thermal','solar','wind','dam','waterp','sewage','park','school','hospital','fire','recycle','smart','ess','levee','breakwater','villa','aptH','aptL','aptS','shopM','office','mall','smartF','lng','windM','offshore','hydro','nuclear','hydrogen','solarF','waterp2','sewage2','bigpark','library','medcenter','fire2','stadium','subway'];
const b64u=u8=>{let t='';for(let i=0;i<u8.length;i+=8192)t+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(t).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};

async function makeVisitCode(){
  const keys=Object.keys(S.b).map(Number).sort((a,b)=>a-b),by=[];let prev=-1;
  const vp=v=>{while(v>127){by.push((v&127)|128);v=Math.floor(v/128)}by.push(v)};
  for(const k of keys){const c=S.b[k],ti=TCODE.indexOf(c.t);if(ti<0)continue;vp(k-prev-1);prev=k;by.push(ti|(c.dmg?128:0))}

$('#list').addEventListener('click',e=>{const it=e.target.closest('.item');if(!it)return;const id=it.dataset.id,b=B[id];
  if(S.un[id]){if(b.tech)buyTech(id);else setTool(tool===id?null:id)}
  else if(S.level<b.lv)toast(b.n+'은(는) 레벨 '+b.lv+'(인구 '+LV[b.lv-1]+'명)부터 배울 수 있습니다',true);
  else showCard(id,true)});
$('#info').addEventListener('click',e=>{const c=e.target.closest('[data-card]');if(c)showCard(c.dataset.card,!S.un[c.dataset.card]);const u=e.target.closest('[data-upg]');if(u&&sel)upgradeAt(sel[0],sel[1],u.dataset.upg);const f=e.target.closest('[data-fix]');if(f){if(!repair(f.dataset.fix))toast('복구할 예산이 부족합니다',true);recompute();updateUI()}});
$('#alerts').addEventListener('click',e=>{if(e.target.closest('#btnFix'))repairAll();if(e.target.closest('#btnBack'))endVisit()});
$('#btnInspect').onclick=()=>setTool(null);
$('#btnDoze').onclick=()=>setTool(tool==='doze'?null:'doze');
$('#btnUpg').onclick=()=>setTool(tool==='upg'?null:'upg');
$('#btnNew').onclick=()=>{if(started)save();showStart()};
$('#btnDex').onclick=showDex;$('#btnPhoto').onclick=()=>{if(started)showPhoto()};$('#btnRep').onclick=showReport;$('#btnQuiz').onclick=bonusQuiz;
[0,1,2].forEach(i=>$('#spd'+i).onclick=()=>{S.speed=i;updateUI()});
let dragging=false;const tip=$('#tip');
function act(p,quiet){if(!p||!started)return;const [x,y]=p;
  if(visiting){sel=cell(x,y)?[x,y]:null;renderInfo();return}
  if(tool==='doze')doze(x,y);else if(tool==='upg')upgradeAt(x,y);else if(tool)place(tool,x,y,quiet);else{sel=cell(x,y)?[x,y]:null;renderInfo()}}
let pan=null,rdrag=false;
function rdoze(p){if(!p||!started||visiting)return;const c=cell(p[0],p[1]);if(!c)return;if(c.t==='hall'){doze(p[0],p[1]);return}
  const nm=B[c.t].n,rf=Math.round(B[c.t].cost*(c.dmg?.1:.3));doze(p[0],p[1]);if(!B[c.t].road)toast(nm+' 철거 · '+rf.toLocaleString()+'원 돌려받음')}
cv.addEventListener('pointerdown',e=>{const p=pick(e);hover=p;
  if(e.button===2){if(started&&!visiting){rdrag=true;rdoze(p);try{cv.setPointerCapture(e.pointerId)}catch(x){}}return}
  if(e.button||!tool){pan={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y,moved:false,p,sel:!e.button&&!tool};camT=null;try{cv.setPointerCapture(e.pointerId)}catch(x){}return}
  dragging=!!(tool&&B[tool]&&B[tool].road);act(p,false);if(dragging){try{cv.setPointerCapture(e.pointerId)}catch(x){}}});
cv.addEventListener('pointermove',e=>{
  if(pan){const dx=e.clientX-pan.x,dy=e.clientY-pan.y;if(Math.abs(dx)+Math.abs(dy)>5)pan.moved=true;if(pan.moved){cam.x=pan.cx-dx/cam.z;cam.y=pan.cy-dy/cam.z;tip.style.display='none';return}}
  const p=pick(e),ch=!hover||!p||hover[0]!==p[0]||hover[1]!==p[1];hover=p;
  if(rdrag&&p&&ch)rdoze(p);
  if(dragging&&p&&ch&&!cell(p[0],p[1]))act(p,true);
  if(p){const r=$('#stage').getBoundingClientRect(),c=cell(p[0],p[1]);let txt='',no=false;
    if(tool&&B[tool]){const w=canPlace(tool,p[0],p[1]);txt=w||B[tool].n+' 건설 · '+B[tool].cost+'원';no=!!w}
    else if(c&&tool==='upg'){const ul=upsOf(c.t);txt=ul.length?B[c.t].n+' → '+B[ul[0]].n+' · '+upCost(c.t,ul[0]).toLocaleString()+'원'+(S.level<B[ul[0]].lv?' (레벨 '+B[ul[0]].lv+' 필요)':!S.un[ul[0]]?' (퀴즈로 배우기)':''):B[c.t].n+' · 더 높은 단계 없음';no=!ul.length}
    else if(c)txt=B[c.t].n+(c.on===false?' · 연결 안 됨':'')+(tool==='doze'?' 철거':'');
    else if(tool!=='doze')txt=['빈 땅','강','산','바다'][terr[p[1]*N+p[0]]];
    tip.textContent=txt;tip.className='tip'+(no?' no':'');tip.style.display=txt?'block':'none';
    tip.style.left=Math.min(r.width-170,e.clientX-r.left+14)+'px';tip.style.top=(e.clientY-r.top+16)+'px';
  }else tip.style.display='none'});
const endDrag=()=>{rdrag=false;if(pan){if(!pan.moved&&pan.sel)act(pan.p,false);pan=null}dragging=false};
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.15:1/1.15,e)},{passive:false});
$('#zIn').onclick=()=>zoomAt(1.25);$('#zOut').onclick=()=>zoomAt(.8);$('#zFit').onclick=()=>{camT=fitZone(S.level,vw,vh)};cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('pointerleave',()=>{hover=null;tip.style.display='none'});
document.addEventListener('keydown',e=>{const mv={ArrowLeft:[-60,0],ArrowRight:[60,0],ArrowUp:[0,-40],ArrowDown:[0,40]}[e.key];if(mv&&!modalOpen&&e.target.tagName!=='INPUT'){cam.x+=mv[0]/cam.z;cam.y+=mv[1]/cam.z;camT=null;e.preventDefault()}
  if(e.key==='Escape'){if(modalOpen&&started&&!$('#modal').querySelector('.opt:not(:disabled)'))closeModal();else if(!modalOpen)setTool(null)}});
window.addEventListener('resize',fit);

/* ===================== 시작 ===================== */
function start(data){
  makeIcons();S=newState(0);ZR=zoneRect(1);recompute();renderMenu();updateUI();fit();requestAnimationFrame(render);
  if(data&&data.b&&MAPS[data.mi])begin(data);else showStart();
  let last=performance.now();
  setInterval(()=>{const now=performance.now(),dt=Math.min(1000,now-last);last=now;
    if(!started||modalOpen||!S.speed||visiting)return;acc+=dt*S.speed;if(acc>=2000){acc=0;tick()}},200);
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot)window.claude.hot.snapshot(()=>started&&!visiting?slim():{});
  document.fonts&&document.fonts.ready&&document.fonts.ready.then(fit);
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready)window.claude.hot.ready(start);else start({});
</script>
</body>
</html>
